name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Normalize Contract Test
        run: |
          mkdir -p target
          rustc --test tests/normalize/normalize_contract.rs -o target/normalize_contract
          ./target/normalize_contract

      - name: Run Shim, Cache, and Run Test Suites
        run: |
          sh tests/shim/test_shim.sh
          sh tests/shim/test_shim_windows.sh
          sh tests/install/test_install_windows.sh
          sh tests/cache/test_cache.sh
          sh tests/run/test_run.sh
          sh tests/run/test_pin.sh
          sh tests/run/test_orca_pin.sh
          sh tests/sessions/test_sessions.sh
          sh tests/patches/test_0003_apply.sh
          sh tests/release/test_release_workflow.sh

      - name: Run Install Test Suite
        env:
          CI: "1"
        run: |
          sh tests/install/test_install.sh

  test-windows:
    name: Windows Native Tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Windows Dispatcher and Installer Suites (Windows PowerShell 5.1)
        shell: cmd
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\shim\test_shim_windows.ps1
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\install\test_install_windows.ps1
          if errorlevel 1 exit /b 1

      - name: Run Windows Dispatcher and Installer Suites (PowerShell 7)
        shell: cmd
        run: |
          pwsh.exe -NoProfile -ExecutionPolicy Bypass -File tests\shim\test_shim_windows.ps1
          if errorlevel 1 exit /b 1
          pwsh.exe -NoProfile -ExecutionPolicy Bypass -File tests\install\test_install_windows.ps1
          if errorlevel 1 exit /b 1
