name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            ext: ""
            optional: false
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: ""
            optional: false
            # grok-build .cargo/config.toml pins aarch64-linux-gnu to
            # target-cpu=neoverse-v2 (ARMv9/SVE2, xAI fleet). That binary
            # SIGILLs on non-SVE hosts (RPi5 Cortex-A76, Neoverse-N1, ...).
            # RUSTFLAGS env replaces config target rustflags (cargo precedence).
            rustflags: "-C target-cpu=generic -C force-unwind-tables=yes"
          - os: macos-14
            target: darwin-arm64
            ext: ""
            optional: false
          - os: macos-15-intel
            target: darwin-x64
            ext: ""
            optional: true
          - os: windows-latest
            target: windows-x64
            ext: ".exe"
            optional: false

    steps:
      - name: Checkout grokgod
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # grok-build's dotslash manifest does not include macos-x86_64 or Windows.
      # Pin the same protoc version as bin/protoc and select it explicitly.
      - name: Install protoc 29.3
        id: protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify protoc
        shell: bash
        run: |
          protoc_path="$(command -v protoc)"
          test -n "$protoc_path"
          echo "PROTOC=$protoc_path" >> "$GITHUB_ENV"
          echo "Using protoc: $protoc_path"
          "$protoc_path" --version

      - name: Install dotslash
        uses: taiki-e/install-action@v2
        with:
          tool: dotslash

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake libssl-dev

      - name: Fetch pinned grok-build commit
        shell: bash
        run: |
          PIN_SHA="$(grep '^PINNED_BASE_SHA=' install.sh | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
          if [ -z "$PIN_SHA" ]; then
            echo "::error::PINNED_BASE_SHA missing in install.sh"
            exit 1
          fi
          echo "PINNED_BASE_SHA resolved: $PIN_SHA"
          git -C grok-build init 2>/dev/null || { mkdir -p grok-build && git -C grok-build init; }
          git -C grok-build remote add origin https://github.com/xai-org/grok-build.git 2>/dev/null || git -C grok-build remote set-url origin https://github.com/xai-org/grok-build.git
          git -C grok-build fetch --depth 1 origin "$PIN_SHA"
          git -C grok-build checkout --detach "$PIN_SHA"
          actual_sha="$(git -C grok-build rev-parse HEAD)"
          echo "grok-build checked out at: $actual_sha"
          if [ "$actual_sha" != "$PIN_SHA" ]; then
            echo "::error::Checked out grok-build SHA ($actual_sha) does not match pinned SHA ($PIN_SHA)"
            exit 1
          fi

      - name: Apply grokgod patches
        shell: bash
        run: |
          REPO_DIR="$PWD"
          shopt -s nullglob
          patches=("$REPO_DIR"/patches/*.patch)
          shopt -u nullglob
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::No patch files found matching patches/*.patch (fail-closed)"
            exit 1
          fi
          for p in "${patches[@]}"; do
            echo "Applying $(basename "$p")"
            git -C grok-build apply "$p"
          done

      - name: Build xai-grok-pager-bin
        shell: bash
        run: |
          cd grok-build
          # cc 1.2.48 does not compile on Windows with rustc 1.94; 1.4.7 casts FILE_ATTRIBUTE_TEMPORARY to u32.
          cargo update -p cc --precise 1.4.7
          if [ -n "${{ matrix.rustflags }}" ]; then
            export RUSTFLAGS="${{ matrix.rustflags }}"
            echo "RUSTFLAGS override: $RUSTFLAGS"
          fi
          CARGO_TARGET_DIR="./target" cargo build --release -p xai-grok-pager-bin

      - name: Package artifact and compute checksum
        shell: bash
        run: |
          mkdir -p dist
          BIN_SRC="grok-build/target/release/xai-grok-pager${{ matrix.ext }}"
          BIN_DST="dist/grokgod-${{ matrix.target }}${{ matrix.ext }}"
          cp "$BIN_SRC" "$BIN_DST"
          chmod +x "$BIN_DST" || true

          "$BIN_DST" --version

          cd dist
          artifact="grokgod-${{ matrix.target }}${{ matrix.ext }}"
          checksum_file="SHA256SUMS-${{ matrix.target }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$artifact" > "$checksum_file"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$artifact" > "$checksum_file"
          else
            echo "::error::Neither sha256sum nor shasum is available"
            exit 1
          fi

          num_lines="$(wc -l < "$checksum_file" | tr -d '[:space:]')"
          if [ "$num_lines" -ne 1 ]; then
            echo "::error::Expected exactly 1 checksum line in $checksum_file, got $num_lines"
            exit 1
          fi

          if ! awk -v expected="$artifact" '
            NF == 2 {
              name = $2
              sub(/^\*/, "", name)
              if (name == expected) matches++
            }
            END { exit matches == 1 ? 0 : 1 }
          ' "$checksum_file"; then
            echo "::error::Checksum line in $checksum_file does not match expected artifact name $artifact"
            cat "$checksum_file"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # No `if: always()`: per-leg continue-on-error already lets optional legs
  # fail without blocking; always() would publish a release missing required
  # assets when a required leg fails.
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Merge checksums and assemble release assets
        id: assemble
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -name "SHA256SUMS-*" -exec cat {} + > release-assets/SHA256SUMS
          find downloaded-artifacts -type f \( -name "grokgod-*" ! -name "SHA256SUMS-*" \) -exec cp {} release-assets/ \;
          cp install.sh install.ps1 release-assets/
          cp src/shim/grok-shim.ps1 src/shim/LauncherHelpers.ps1 release-assets/

          # Append checksums for runtime scripts to SHA256SUMS
          cd release-assets
          for script_asset in grok-shim.ps1 LauncherHelpers.ps1 install.ps1; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$script_asset" >> SHA256SUMS
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$script_asset" >> SHA256SUMS
            else
              echo "::error::Neither sha256sum nor shasum is available"
              exit 1
            fi
          done
          sort SHA256SUMS -o SHA256SUMS
          cd ..

          echo "=== Release Assets ==="
          ls -la release-assets/
          echo "=== SHA256SUMS ==="
          cat release-assets/SHA256SUMS

      - name: Verify required assets exist
        run: |
          for t in linux-x64 linux-arm64 darwin-arm64; do
            if [ ! -s "release-assets/grokgod-$t" ]; then
              echo "::error::missing required asset release-assets/grokgod-$t"
              exit 1
            fi
          done
          if [ ! -s "release-assets/grokgod-windows-x64.exe" ]; then
            echo "::error::missing required asset release-assets/grokgod-windows-x64.exe"
            exit 1
          fi
          for runtime in grok-shim.ps1 LauncherHelpers.ps1 install.ps1; do
            if [ ! -s "release-assets/$runtime" ]; then
              echo "::error::missing required runtime asset release-assets/$runtime"
              exit 1
            fi
            if ! awk -v expected="$runtime" '
              NF == 2 {
                name = $2
                sub(/^\*/, "", name)
                if (name == expected) matches++
              }
              END { exit matches == 1 ? 0 : 1 }
            ' release-assets/SHA256SUMS; then
              echo "::error::missing or duplicate checksum entry for runtime asset $runtime in SHA256SUMS"
              exit 1
            fi
          done

      - name: Resolve versions and build release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          prev=$(git tag --sort=-version:refname | grep -v "^${tag}$" | head -n1 || true)
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            range="${prev}..${tag}"
          else
            range="${tag}"
          fi

          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --pretty='- %s (%h)' "$range"
            else
              git log --pretty='- %s (%h)' "$tag" 2>/dev/null || git log -n 10 --pretty='- %s (%h)'
            fi
            echo
            echo "## Install"
            echo
            echo '**macOS / Linux:**'
            echo '```bash'
            echo "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash"
            echo '```'
            echo
            echo '**Windows (PowerShell):**'
            echo '```powershell'
            echo "irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex"
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${prev}...${tag}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.notes.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; immutable release policy forbids mutating or clobbering existing releases"
            exit 1
          fi
          ASSETS=(release-assets/*)
          gh release create "$tag" "${ASSETS[@]}" \
            --title "grokgod $tag" \
            --notes-file release-notes.md
