# Opt-in overlay for Orca-launched grok sessions.
# Copy to ~/.grokgod/pin/orca-pin.toml to enable.
# GROK_CONFIG_PATH merges this ON TOP of config.toml at startup.
# Allowlisted sections only: [models], [features], [toolset.bash],
# [toolset.web_search], [shell_environment_policy], [model.<id>].
# Never add api_key/auth/mcp_servers/plugins/subagents here.

[models]
default = "flash-max"

[model.flash-max]
reasoning_effort = "max"
