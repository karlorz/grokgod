# Historical template for Orca automation overlay pin.
# The shim no longer loads this file; Orca automations select the model with -m.
# GROK_CONFIG_PATH merges overlays ON TOP of config.toml when set.
# Allowlisted sections only: [models], [features], [toolset.bash],
# [toolset.web_search], [shell_environment_policy].
# NOTE: [model.<id>] per-model sections are NOT in the overlay allowlist
# (only the [models] table passes through). Use default_reasoning_effort
# in [models] instead of [model.<id>].reasoning_effort.
# Never add api_key/auth/mcp_servers/plugins/subagents here.

[models]
default = "flash-max"
default_reasoning_effort = "max"
